<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Nova AI — Aashin Hamdhan</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    overflow:hidden;

    display:flex;

    align-items:center;

    justify-content:center;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(124,58,237,.30),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 80%,
            rgba(6,182,212,.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 50%,
            #151027,
            #050509 70%
        );
}


/* =====================================================
   BACKGROUND ORBS
===================================================== */

.bg-orb{

    position:absolute;

    border-radius:50%;

    filter:blur(80px);

    pointer-events:none;

    opacity:.4;

    animation:
        orbFloat 8s ease-in-out infinite alternate;
}


.orb-one{

    width:250px;
    height:250px;

    background:#7c3aed;

    top:-80px;
    left:-80px;
}


.orb-two{

    width:220px;
    height:220px;

    background:#06b6d4;

    bottom:-70px;
    right:-60px;

    animation-delay:2s;
}


.orb-three{

    width:140px;
    height:140px;

    background:#ec4899;

    top:45%;
    right:5%;

    animation-delay:4s;
}


@keyframes orbFloat{

    0%{

        transform:
            translate(0,0)
            scale(1);

    }

    100%{

        transform:
            translate(50px,-30px)
            scale(1.2);

    }

}


/* =====================================================
   PARTICLES
===================================================== */

.particles{

    position:absolute;

    inset:0;

    overflow:hidden;

    pointer-events:none;
}


.particles span{

    position:absolute;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#fff;

    opacity:.5;

    animation:
        particleMove
        linear
        infinite;
}


.particles span:nth-child(1){
    left:10%;
    top:80%;
    animation-duration:8s;
}

.particles span:nth-child(2){
    left:20%;
    top:60%;
    animation-duration:11s;
}

.particles span:nth-child(3){
    left:35%;
    top:90%;
    animation-duration:9s;
}

.particles span:nth-child(4){
    left:50%;
    top:70%;
    animation-duration:13s;
}

.particles span:nth-child(5){
    left:65%;
    top:85%;
    animation-duration:10s;
}

.particles span:nth-child(6){
    left:80%;
    top:60%;
    animation-duration:12s;
}

.particles span:nth-child(7){
    left:90%;
    top:85%;
    animation-duration:9s;
}

.particles span:nth-child(8){
    left:45%;
    top:50%;
    animation-duration:15s;
}


@keyframes particleMove{

    0%{

        transform:
            translateY(100px);

        opacity:0;

    }

    20%{

        opacity:.6;

    }

    80%{

        opacity:.6;

    }

    100%{

        transform:
            translateY(-700px);

        opacity:0;

    }

}


/* =====================================================
   MAIN CARD
===================================================== */

.card{

    position:relative;

    z-index:10;

    width:
        min(450px,92%);

    padding:
        40px 30px 30px;

    text-align:center;

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(30,27,50,.85),
            rgba(10,10,18,.80)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    backdrop-filter:
        blur(30px);

    -webkit-backdrop-filter:
        blur(30px);

    box-shadow:

        0 30px 100px
        rgba(0,0,0,.65),

        inset
        0 1px
        rgba(255,255,255,.08);

    animation:
        cardIn .9s ease;
}


@keyframes cardIn{

    from{

        opacity:0;

        transform:
            translateY(40px)
            scale(.92);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =====================================================
   TOP LABEL
===================================================== */

.top-label{

    display:inline-flex;

    gap:7px;

    padding:
        7px 13px;

    margin-bottom:18px;

    border-radius:30px;

    font-size:11px;

}


.top-dot{

@keyframes blink{

/* =====================================================
   LOGO
===================================================== */

.logo{

@keyframes logoPulse{

    }

}

===================================================== */

h1{

.creator{

.creator strong{

}

   SUBTITLE
===================================================== */

.subtitle{

}


/* =====================================================
   AI CORE
===================================================== */

.ai-core{

    position:relative;

    width:200px;
    height:200px;

    margin:
        0 auto 20px;

    display:flex;

    align-items:center;

    justify-content:center;
}


/* Outer rotating ring */

.core-ring{

    position:absolute;

    width:190px;
    height:190px;

    border-radius:50%;

    border:
        1px solid
        rgba(139,92,246,.30);

    border-top-color:
        #8b5cf6;

    border-right-color:
        #06b6d4;

    animation:
        rotate 5s linear infinite;
}


.core-ring-two{

    position:absolute;

    width:165px;
    height:165px;

    border-radius:50%;

    border:
        1px dashed
        rgba(103,232,249,.35);

    animation:
        rotateReverse 8s linear infinite;
}


@keyframes rotate{

    to{
        transform:
            rotate(360deg);
    }

}


@keyframes rotateReverse{

    to{
        transform:
            rotate(-360deg);
    }

}


/* =====================================================
   CORE GLOW
===================================================== */

.core-glow{

    position:absolute;

    width:135px;
    height:135px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(139,92,246,.40),
            rgba(6,182,212,.12),
            transparent 70%

    filter:blur(8px);

    animation:
        coreGlow 2s ease-in-out infinite alternate;
}


@keyframes coreGlow{

    from{
        transform:scale(.9);
    }

    to{
        transform:scale(1.15);
    }

}


/* =====================================================
   MICROPHONE
===================================================== */

.mic{

    position:relative;

    z-index:5;

    width:105px;
    height:105px;

    border:none;

    border-radius:50%;

    cursor:pointer;

    font-size:40px;

    color:white;

    background:
        linear-gradient(
            145deg,
            #8b5cf6,
            #6366f1,
            #06b6d4
        );

    box-shadow:

        0 10px 35px
        rgba(99,102,241,.45),

        inset
        0 1px
        rgba(255,255,255,.25);

    transition:
        transform .25s,
        box-shadow .25s;
}


.mic:hover{

    transform:
        scale(1.08);

    box-shadow:

        0 15px 55px
        rgba(99,102,241,.75),

        0 0 30px
        rgba(6,182,212,.35);
}


.mic:active{

    transform:
        scale(.94);
}


.mic:disabled{

    opacity:.5;

    cursor:
        not-allowed;
}


/* =====================================================
   LISTENING
===================================================== */

.listening{

    animation:
        listeningPulse
        .8s ease-in-out
        infinite alternate;

    box-shadow:

        0 0 0 12px
        rgba(139,92,246,.15),

        0 0 0 25px
        rgba(6,182,212,.10),

        0 0 70px
        rgba(139,92,246,.9);
}


@keyframes listeningPulse{

        transform:

}


/* =====================================================
   STATUS
===================================================== */

.status{

===================================================== */

/* =====================================================
   WAVEFORM
===================================================== */

.wave{

.wave span:nth-child(2){

.wave span:nth-child(7){

.wave span:nth-child(8){

@keyframes wave{

}

<!-- =================================================

<div class="bg-orb orb-one"></div>

<!-- =================================================

================================================== -->

<div class="card">


    <!-- ONLINE LABEL -->

    <div class="top-label">

        <span class="top-dot"></span>

        NOVA SYSTEM ONLINE

    </div>


    <!-- LOGO -->

    <div class="logo">

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const mic =
    document.getElementById("mic");

const status =
    document.getElementById("status");

const song =
    document.getElementById("song");


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let youtubeTab = null;

let listening = false;



/* =====================================================
   BROWSER SUPPORT
===================================================== */

if(!SpeechRecognition){

    status.textContent =
        "⚠️ Speech recognition unavailable";

    mic.disabled = true;

}


/* =====================================================
   SETUP
===================================================== */

else{

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;



    /* =================================================
       LISTENING START
    ================================================= */

    recognition.onstart = () => {

        listening = true;

        mic.classList.add(
            "listening"
        );

        status.textContent =
            "🎧 Nova is listening...";

        song.textContent =
            "Waiting for song name...";

    };



    /* =================================================
       LISTENING END
    ================================================= */

    recognition.onend = () => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

    };



    /* =================================================
       SPEECH ERROR
    ================================================= */

    recognition.onerror =
        (event) => {

        console.error(
            "Speech recognition error:",
            event.error
        );


        listening = false;

        mic.classList.remove(
            "listening"
        );


        if(event.error === "not-allowed"){

            status.textContent =
                "🎙️ Microphone permission denied";

        }

        else{

            status.textContent =
                "⚠️ Couldn't hear you. Try again";

        }


        song.textContent =
            "No song selected";

    };



    /* =================================================
       SPEECH RESULT
    ================================================= */

    recognition.onresult =
        async (event) => {


        const command =
            event.results[0][0]
            .transcript
            .trim();


        /* ---------------------------------------------
           EMPTY COMMAND
        --------------------------------------------- */

        if(!command){

            status.textContent =
                "No song detected";

            return;

        }


        /* ---------------------------------------------
           DISPLAY SONG
        --------------------------------------------- */

        song.textContent =
            command;


        status.textContent =
            "🔎 Nova is finding your song...";



        /* ---------------------------------------------
           SEND TO FLASK
        --------------------------------------------- */

        try{


            const response =
                await fetch(
                    "/youtube/play",
                    {

                        method:
                            "POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                command:
                                    command

                            })

                    }
                );



            /* -----------------------------------------
               SERVER RESPONSE
            ----------------------------------------- */

            const data =
                await response.json();



            /* -----------------------------------------
               SONG NOT FOUND
            ----------------------------------------- */

            if(!data.success){

                status.textContent =
                    data.message ||
                    "❌ Song not found";

                return;

            }



            /* -----------------------------------------
               OPEN YOUTUBE
            ----------------------------------------- */

            if(
                !youtubeTab ||
                youtubeTab.closed
            ){

                youtubeTab =
                    window.open(

                        data.url,

                        "NovaYouTube"

                    );

            }

            else{

                youtubeTab.location.href =
                    data.url;

                youtubeTab.focus();

            }



            /* -----------------------------------------
               PLAYING
            ----------------------------------------- */

            status.textContent =
                "▶️ Playing on YouTube";

        }



        /* ---------------------------------------------
           CONNECTION ERROR
        --------------------------------------------- */

        catch(error){

            console.error(
                "Server error:",
                error
            );


            status.textContent =
                "❌ Server connection failed";

        }

    };



    /* =================================================
       MICROPHONE BUTTON
    ================================================= */

    mic.onclick = () => {


        if(listening){

            return;

        }


        try{

            recognition.start();

        }

        catch(error){

            console.log(
                "Recognition start error:",
                error
            );

        }

    };



    /* =================================================
       SPACEBAR SHORTCUT
    ================================================= */

    document.addEventListener(
        "keydown",
        (event) => {

            if(
                event.code === "Space" &&
                event.target.tagName !== "INPUT"
            ){

                event.preventDefault();

                if(!listening){

                    try{

                        recognition.start();

                    }

                    catch(error){

                        console.log(error);

                    }

                }

            }

        }
    );

}

</script>


</body>
