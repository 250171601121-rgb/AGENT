<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    font-family:
        Arial,
        Helvetica,
        sans-serif;
    color:white;
    background:#02030a;
}


/* =========================================================
   ANIMATED BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(80,50,180,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 90%,
            rgba(0,200,255,.12),
            transparent 30%
        ),
        #02030a;
}


/* Grid */

.grid{
    position:absolute;
    inset:-50%;
    width:200%;
    height:200%;

    background-image:
        linear-gradient(
            rgba(120,120,255,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(120,120,255,.055) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    transform:
        perspective(500px)
        rotateX(65deg);

    animation:
        gridMove 12s linear infinite;
}

@keyframes gridMove{

    from{
        transform:
            perspective(500px)
            rotateX(65deg)
            translateY(0);
    }

    to{
        transform:
            perspective(500px)
            rotateX(65deg)
            translateY(55px);
    }
}


/* =========================================================
   GLOWING ORBS
========================================================= */

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    animation:orbFloat 10s ease-in-out infinite alternate;
}

.orb1{
    width:350px;
    height:350px;
    background:#6d28d9;
    left:-150px;
    top:-150px;
}

.orb2{
    width:300px;
    height:300px;
    background:#0891b2;
    right:-120px;
    bottom:-120px;
    animation-delay:2s;
}

.orb3{
    width:180px;
    height:180px;
    background:#db2777;
    right:15%;
    top:5%;
    animation-delay:4s;
}

@keyframes orbFloat{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:
            translate(70px,-40px)
            scale(1.25);
    }
}


/* =========================================================
   PARTICLES
========================================================= */

.particles{
    position:absolute;
    inset:0;
}

.particles span{
    position:absolute;

    width:2px;
    height:2px;

    background:white;
    border-radius:50%;

    opacity:.5;

    animation:
        particle linear infinite;
}

.particles span:nth-child(1){
    left:5%;
    animation-duration:12s;
}

.particles span:nth-child(2){
    left:12%;
    animation-duration:16s;
}

.particles span:nth-child(3){
    left:22%;
    animation-duration:10s;
}

.particles span:nth-child(4){
    left:34%;
    animation-duration:14s;
}

.particles span:nth-child(5){
    left:47%;
    animation-duration:18s;
}

.particles span:nth-child(6){
    left:58%;
    animation-duration:11s;
}

.particles span:nth-child(7){
    left:70%;
    animation-duration:15s;
}

.particles span:nth-child(8){
    left:82%;
    animation-duration:13s;
}

.particles span:nth-child(9){
    left:92%;
    animation-duration:17s;
}

@keyframes particle{

    from{
        transform:translateY(110vh);
        opacity:0;
    }

    15%{
        opacity:.6;
    }

    85%{
        opacity:.6;
    }

    to{
        transform:translateY(-10vh);
        opacity:0;
    }
}


/* =========================================================
   MAIN INTERFACE
========================================================= */

.interface{
    position:relative;
    z-index:5;

    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    width:min(900px,90%);

    display:flex;
    justify-content:space-between;
    align-items:center;

    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;

    background:rgba(10,10,20,.45);

    backdrop-filter:blur(20px);

    box-shadow:
        0 10px 40px rgba(0,0,0,.3);
}

.system{

    align-items:center;

}

.online{

}

@keyframes blink{

    50%{

    }
}

.clock{
    font-size:12px;

}


/* =========================================================
   BRAND
========================================================= */

.brand{

    animation:
        gradientText 5s linear infinite;
}

@keyframes gradientText{

    to{
        background-position:250%;
    }
}

.creator{

    font-size:13px;

}

.creator strong{
    color:#67e8f9;

    text-shadow:
        0 0 15px
        rgba(103,232,249,.4);
}


/* =========================================================
   AI CORE
========================================================= */

.ai{
    position:relative;

    width:330px;
    height:330px;

    margin:10px auto;
}


/* Outer ring */

.ring{
    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    border:1px solid rgba(139,92,246,.3);

    pointer-events:none;
}

.ring1{
    width:320px;
    height:320px;

    border-top-color:#8b5cf6;
    border-right-color:#06b6d4;

    animation:
        rotate 7s linear infinite;
}

.ring2{
    width:285px;
    height:285px;

    border-style:dashed;

    border-color:rgba(103,232,249,.25);

        rotateReverse 11s linear infinite;
}

.ring3{

    height:250px;

    border-left-color:#ec4899;
    border-bottom-color:#8b5cf6;

    animation:
        rotate 5s linear infinite;
}

@keyframes rotate{
    to{
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

@keyframes rotateReverse{
    to{
        transform:
            translate(-50%,-50%)
            rotate(-360deg);
    }
}


/* =========================================================
   ENERGY DOTS
========================================================= */

.energy{
    position:absolute;

    inset:0;

    animation:
        rotate 9s linear infinite;
}

.energy i{
    position:absolute;

    width:7px;
    height:7px;

    border-radius:50%;

    box-shadow:

}

.energy i:nth-child(1){
    top:2px;
    left:50%;
}

.energy i:nth-child(2){
    right:5px;
    top:50%;
}

.energy i:nth-child(3){
    bottom:2px;
    left:50%;
}

.energy i:nth-child(4){
    left:5px;
    top:50%;
}


/* =========================================================
   CORE GLOW
========================================================= */

.core-glow{
    position:absolute;

    left:50%;
    top:50%;

    width:190px;
    height:190px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(139,92,246,.5),
            rgba(6,182,212,.2),
            transparent 70%
        );

    filter:blur(15px);

    animation:
        coreGlow 2s ease-in-out infinite alternate;
}

@keyframes coreGlow{

    from{
        transform:
            translate(-50%,-50%)
            scale(.85);
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.2);
    }
}


/* =========================================================
   MICROPHONE BUTTON
========================================================= */

.mic{
    position:absolute;

    z-index:10;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:135px;
    height:135px;

    border:none;

    border-radius:50%;

    cursor:pointer;

    font-size:48px;

    color:white;

    background:
        radial-gradient(
            circle at 35% 25%,
            #a78bfa,
            #6366f1 45%,
            #0891b2
        );

    box-shadow:

        0 0 25px
        rgba(99,102,241,.6),

        0 0 70px
        rgba(6,182,212,.25),

        inset 0 2px
        rgba(255,255,255,.35);

    transition:
        .3s;
}

.mic:hover{

        translate(-50%,-50%)
        scale(1.08);

    box-shadow:

        0 0 40px

        0 0 100px
        rgba(6,182,212,.35);
}

.mic:active{

    transform:
        translate(-50%,-50%)
        scale(.95);
}

.mic:disabled{
    opacity:.4;

}


/* =========================================================
   LISTENING
========================================================= */

.listening{

        listening 700ms

}

@keyframes listening{

========================================================= */

.status{

.visualizer span:nth-child(1){
    animation-delay:.1s;
}

.visualizer span:nth-child(2){

}

.visualizer span:nth-child(3){

}

.visualizer span:nth-child(4){

}

.visualizer span:nth-child(5){

}

.visualizer span:nth-child(6){

}

.visualizer span:nth-child(7){

}

.visualizer span:nth-child(8){

@keyframes bars{

========================================================= */

.now-playing{

        1px solid

    background:
        rgba(10,10,20,.55);

        blur(20px);

        0 15px 50px

    transition:
        .3s;

.now-playing:hover{

.album{

</style>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const mic =
    document.getElementById("mic");

const status =
    document.getElementById("status");

const song =
    document.getElementById("song");

const clock =
    document.getElementById("clock");


/* =========================================================
   LIVE CLOCK
========================================================= */

function updateClock(){

    const now =
        new Date();

    clock.textContent =
        now.toLocaleTimeString(
            [],
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );
}

updateClock();

setInterval(
    updateClock,
    1000
);


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let youtubeTab = null;

let listening = false;



/* =========================================================
   BROWSER SUPPORT
========================================================= */

if(!SpeechRecognition){

    status.textContent =
        "⚠️ Speech recognition is not supported";

    mic.disabled = true;

}


/* =========================================================
   RECOGNITION
========================================================= */

else{

    const recognition =
        new SpeechRecognition();


    recognition.lang =
        "en-US";


    recognition.continuous =
        false;


    recognition.interimResults =
        false;



    /* =====================================================
       START LISTENING
    ====================================================== */

    recognition.onstart = () => {

        listening = true;

        mic.classList.add(
            "listening"
        );

        status.textContent =
            "🎧 Nova is listening...";

        song.textContent =
            "Listening for a song name...";

    };



    /* =====================================================
       END LISTENING
    ====================================================== */

    recognition.onend = () => {

        listening = false;

        mic.classList.remove(
            "listening"
        );

    };



    /* =====================================================
       ERROR
    ====================================================== */

    recognition.onerror =
        (event) => {

        console.error(
            "Speech recognition:",
            event.error
        );


        listening = false;

        mic.classList.remove(
            "listening"
        );


        if(
            event.error ===
            "not-allowed"
        ){

            status.textContent =
                "🎙️ Microphone permission denied";

        }

        else{

            status.textContent =
                "⚠️ I couldn't hear you. Try again";

        }


        song.textContent =
            "No song selected";

    };



    /* =====================================================
       RESULT
    ====================================================== */

    recognition.onresult =
        async (event) => {


        const command =
            event
            .results[0][0]
            .transcript
            .trim();


        if(!command){

            status.textContent =
                "No song detected";

            return;

        }


        /* Show recognized song */

        song.textContent =
            command;


        status.textContent =
            "🔎 Nova is searching...";


        try{


            /* =============================================
               SEND TO YOUR FLASK SERVER
            ============================================== */

            const response =
                await fetch(
                    "/youtube/play",
                    {

                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                command:
                                    command

                            })

                    }
                );


            const data =
                await response.json();


            /* =============================================
               FAILURE
            ============================================== */

            if(!data.success){

                status.textContent =
                    data.message ||
                    "❌ Song not found";

                return;

            }


            /* =============================================
               OPEN YOUTUBE
            ============================================== */

            if(
                !youtubeTab ||
                youtubeTab.closed
            ){

                youtubeTab =
                    window.open(
                        data.url,
                        "NovaYouTube"
                    );

            }

            else{

                youtubeTab.location.href =
                    data.url;

                youtubeTab.focus();

            }


            /* =============================================
               SUCCESS
            ============================================== */

            status.textContent =
                "▶️ Playing on YouTube";

        }


        catch(error){

            console.error(
                error
            );


            status.textContent =
                "❌ Server connection failed";

        }

    };



    /* =====================================================
       MICROPHONE CLICK
    ====================================================== */

    mic.onclick = () => {

        if(listening)
            return;


        try{

            recognition.start();

        }

        catch(error){

            console.log(
                "Recognition error:",
                error
            );

        }

    };



    /* =====================================================
       SPACEBAR SHORTCUT
    ====================================================== */

    document.addEventListener(
        "keydown",
        (event) => {

            if(
                event.code === "Space" &&
                event.target.tagName !== "INPUT" &&
                !listening
            ){

                event.preventDefault();

                try{

                    recognition.start();

                }

                catch(error){

                    console.log(error);

                }

            }

        }
    );

}

</script>
